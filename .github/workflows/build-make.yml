---
# Fantasque Sans Mono — Standard Makefile build verification.
#
# Runs the real `make clean && make` pipeline — the zero-touch path that
# AC-003/004/005 are defined against — and uploads the full `Variants/`
# tree as an artifact. Added 2026-08-14 (user decision, Option 1) because
# the `custom-build` workflow exercises `custom_build_driver.py` (a single
# selected variant, no CSS declaration), which cannot evidence AC-003
# (4 permutations via the Makefile wildcard), AC-004 (CSS via
# `generate-css-decl`), or AC-005 (all-variant archives via
# `zip-all-variants`).
#
# Toolchain mirrors Dockerfile Stage 1 + Stage 2 (identical apt packages):
#   Stage 1: fontforge, make, python3-pip + `future` (legacy build.py
#            imports `from past.builtins import xrange` via fontbuilder.py)
#   Stage 2: ttfautohint, woff-tools (sfnt2woff), woff2 (woff2_compress),
#            zip, tar
#
# The unit-test (macro) gate runs first: pytest + jsonschema on the host
# runner, mirroring custom-build.yml. A failing suite aborts before any
# font work.
name: Standard Build (make)

"on":
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: make-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build all variants via make
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        # Pinned to commit SHA (tag v7, 2026-07-17) — supply-chain hygiene
        # per plan-refactor-medium-weight-v1.0.md SEC-001 (finding A-01).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install build toolchain
        run: |
          # apt packages stay version-unpinned: the list mirrors the Dockerfile
          # toolchain (Stages 1/2, itself unpinned) and the runner image
          # (ubuntu-latest) is rolling, so pinned apt versions would go stale.
          # SEC-001 acceptance: baseline-consistent (TASK-302).
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            fontforge \
            make \
            python3-pip \
            ttfautohint \
            woff-tools \
            woff2 \
            zip \
            tar
          # Cache cleanup convention matches Dockerfile Stages 1/2.
          sudo rm -rf /var/lib/apt/lists/*
          # sudo: the runner user is non-root and pip is PEP 668 externally
          # managed; --break-system-packages + root installs to system
          # site-packages (visible to fontforge's embedded Python).
          # pip packages are version-pinned (SEC-001, finding A-02); versions
          # match the local macro-gate environment as of 2026-08-16.
          sudo pip3 install --break-system-packages --no-cache-dir \
            pytest==9.1.1 \
            jsonschema==4.26.0 \
            future==1.0.0

      - name: Run unit tests (macro gate)
        run: python3 -m pytest tests/ -v

      - name: Build all variants (make)
        run: |
          make clean
          make

      - name: Upload Variants
        # Pinned to commit SHA (tag v4, 2025-03-19) — SEC-001 (finding A-01).
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: standard-build-variants-${{ github.run_id }}-${{ github.run_attempt }}
          path: Variants/
          if-no-files-found: error
          retention-days: 90
